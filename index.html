<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="assets/images/favicon.webp">
    <title>Turnguys Games</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #fff;
        }
        img {
            display: block;
            width: min(100%, 800px);
            height: auto;
            max-height: calc(100svh - 48px);
            object-fit: contain;
        }
    </style>
</head>
<body>
    <img src="assets/images/turnguys-games.webp" alt="Turnguys Games" width="800" height="335">
</body>
</html>
